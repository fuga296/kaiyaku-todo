<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>グレードアップ - サブスク管理(仮称)</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="mock-bar" role="note">これは模擬です。実際の決済・課金は行われません。</div>
  <div class="head-main">
    <h1 class="brand">サブスク管理<span class="tentative">(仮称)</span></h1>
    <div class="head-slot"><a class="btn-text back" href="index.html">契約状況に戻る</a></div>
  </div>
</header>

<main class="wrap narrow">

  <section class="block" aria-labelledby="h-plan">
    <h2 id="h-plan">グレードアップ</h2>

    <div id="already" hidden>
      <p id="already-text">すでにご契約中です。</p>
      <p><a class="btn" href="index.html">契約状況に戻る</a></p>
    </div>

    <div id="offer">
      <table class="plan-table">
        <tbody>
          <tr><th scope="row">プラン</th><td id="plan-name"></td></tr>
          <tr><th scope="row">料金</th><td id="plan-price"></td></tr>
          <tr><th scope="row">内容</th><td>〔要差し替え: グレードアップの内容は未定〕</td></tr>
        </tbody>
      </table>

      <form id="plan-form" class="plan-form" autocomplete="off">
        <fieldset class="f f-usage">
          <legend>このサービスの利用回数(ご自身で見込みを入力)</legend>
          <div class="pair">
            <input id="in-usage" type="number" min="0" step="any" inputmode="decimal" required aria-label="利用回数">
            <span class="unit">回 /</span>
            <select id="in-usage-unit" aria-label="利用回数の期間">
              <option value="week">週</option>
              <option value="month" selected>月</option>
              <option value="year">年</option>
            </select>
          </div>
        </fieldset>
        <p class="note">カード番号などの入力はありません。ここで契約すると、契約状況の一覧にこのサービスが1件入ります。</p>
        <div class="actions">
          <button class="btn" type="submit" id="submit">契約する(模擬)</button>
          <a class="btn-text" href="index.html">やめる</a>
        </div>
        <p class="error" id="error" role="alert" hidden></p>
      </form>
    </div>
  </section>

</main>

<footer class="site-footer">
  <p>これは模擬です。実際の決済・課金は行われません。入力した内容はこのブラウザの中にだけ保存されます。</p>
</footer>

<script src="js/payment.js"></script>
<script src="js/plan.js"></script>
</body>
</html>
